name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Model z release, state.json ze stejného release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/fetch_release.py
      - run: python scripts/export_static.py
      - run: python scripts/check_predictions.py dist/data/matches.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: state.json do release (přepíše jen ten asset)
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test -f data/online-cache/state.json
          gh release view model -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create model -R "${{ github.repository }}" --title model --notes "fotbal model"
          gh release upload model data/online-cache/state.json --clobber -R "${{ github.repository }}"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  keepalive:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}", ME: "${{ github.run_id }}" }
        run: |
          sleep 480
          newer=$(gh run list -R "$R" -w pages.yml -L 5 --json databaseId,createdAt --jq "[.[]|select(.databaseId > $ME)]|length")
          if [ "$newer" -gt 0 ]; then echo "mezitím začal jiný běh – bez zálohy"; else gh workflow run pages.yml -R "$R"; echo "spuštěn další export"; fi
